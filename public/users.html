<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <title>Users</title>
</head>

<body class="bg-light d-flex flex-column h-100vh">
    <div id="navbar">
        <!-- Navbar will be loaded here -->
    </div>
    <div class="container mt-5 d-flex flex-column align-items-center border p-5 rounded justify-content-center">
        <h2 class="mb-4">Users List</h2>
        <div class="container d-flex justify-content-between mb-3">
            <div>
                <form action="" class="d-flex w-100" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search Users" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
            <div class="d-flex justify-content-end mb-3">
                <a href="#" class="btn btn-success" onclick="addNewUser()">Add New User</a>
            </div>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody" class="w-100 usersData">
                <!-- User rows will be populated here -->
            </tbody>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/script.js"></script>
    <script>
        $(function () {
            $("#navbar").load("./navbar.html");
        })
    </script>
</body>

</html>
