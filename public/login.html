<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Login</title>
    <style>
        .message {
            opacity: 0;
            font-weight: bold;
            font-size: 20px;
            color: green;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-light d-flex flex-column h-100vh">
    <div id="navbar">
        <!-- Navbar will be loaded here -->
    </div>
    <div class="container align-items-center d-flex flex-column mb-5">
        <h2 class="mb-4">Login</h2>
        <div id="loginMessage"></div>
        <form id="loginForm" class="w-75 d-flex flex-column align-items-center">
            <div class="mb-3 w-75">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required />
            </div>
            <div class="mb-3 w-75">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <button type="submit" class="btn btn-primary w-75">Login</button>
            <p class="mt-3 text-center">Don't have an account? <a href="./register.html">Register here</a></p>
        </form>
    </div>
    <div id="footer" class="mt-5">
        <!-- Footer will be loaded here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/script.js"></script>
    <script>
        $(function(){
            $("#navbar").load("./navbar.html");
        })

        $(function(){
            $("#footer").load("./footer.html");
        })
    </script>
</body>

</html>
