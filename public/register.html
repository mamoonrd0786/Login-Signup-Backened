<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .message {
            opacity: 0;
            font-weight: bold;
            font-size: 20px;
            color: green;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
</head>

<body class="bg-light d-flex flex-column h-100vh" style="min-height: 100vh;">
    <div id="navbar" class="sticky-top">
        <!-- Navbar will be loaded here -->
    </div>
    <div class="container-fluid d-flex flex-column align-items-center justify-content-center gap-3"
        style="min-height: 100vh;">
        <div class="container align-items-center d-flex flex-column" id="registerContainer">
            <h2 class="mt-2">Register User</h2>
            <div id="newChild"></div>
            <form id="registerForm" class="w-75 d-flex flex-column align-items-center">
                <div class="mb-3 w-75">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required />
                </div>
                <div class="mb-3 w-75">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required />
                </div>
                <div class="mb-3 w-75">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required />
                </div>
                <div class="mb-3 w-75">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required />
                </div>
                <select class=" w-75 form-select mb-3" id="role" name="role">
                    <option value="" disabled selected>Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="librarian">Librarian</option>
                </select>
                <button type="submit" class="btn btn-primary w-75" id="registerForm">Register</button>
                <p class="mt-3 text-center">Already have an account? <a href="./login.html">Login here</a></p>
            </form>
            <span>or</span>
            <div id="" class="w-75 container d-flex flex-row align-items-center mt-3 justify-content-center">
                <button class="btn btn-outline-primary gap-2 ms-2"><i class="bi bi-google gap-2">Continue with
                        Google</i></button>
                <button class="btn btn-outline-primary gap-2 ms-4"><i class="bi bi-facebook text-dark">Continue with
                        Facebook</i></button>
            </div>
        </div>

    </div>
    <div id="footer" class="mt-5">
        <!-- Footer will be loaded here -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/script.js"></script>
    <script>
        $(function () {
            $("#navbar").load("./navbar.html");
        })

        $(function () {
            $("#footer").load("./footer.html");
        })
    </script>
</body>

</html>
