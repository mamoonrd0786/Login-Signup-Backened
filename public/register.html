<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .message {
            opacity: 0;
            font-weight: bold;
            font-size: 20px;
            color: green;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
</head>

<body>
     <div id="navbar">
        <!-- Navbar will be loaded here -->
    </div>
    <div>
        <div class="container align-items-center d-flex flex-column">
            <h2 class="mt-2">Register</h2>
            <div id="newChild"></div>
            <form id="registerForm" class="w-75 d-flex flex-column align-items-center">
                <div class="mb-3 w-75">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required />
                </div>
                <div class="mb-3 w-75">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required />
                </div>
                <div class="mb-3 w-75">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required />
                </div>
                <select class=" w-75 form-select mb-3" id="role" name="role">
                    <option value="" disabled selected>Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="librarian">Librarian</option>
                </select>
                <button type="submit" class="btn btn-primary w-75" id="registerForm">Register</button>
                <p class="mt-3 text-center">Already have an account? <a href="./login.html">Login here</a></p>
            </form>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/script.js"></script>
    <script>
        $(function(){
            $("#navbar").load("./navbar.html");
        })
    </script>
</body>

</html>
